# Nightly News-by-Equation run.
#
# Analyses yesterday's most-read English Wikipedia articles, writes
# output/nbe.json (the file the sapientronic.ai hero panel replays) and
# commits it together with state/ — so every forecast is on record before
# it is graded, and the scorecard can't be edited after the fact.
#
# The live site pulls output/nbe.json from this repo on a schedule; no
# hosting credentials are stored here.

name: nightly

on:
  schedule:
    # 05:20 UTC — Wikimedia's daily top lists for the previous day are
    # normally published by then.
    - cron: "20 5 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to analyse (YYYY-MM-DD). Default: yesterday, UTC."
        required: false

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      # Raw API responses (page views, links, edit histories). Restored from
      # the previous night so each run only fetches what's new.
      - name: Restore fetch cache
        uses: actions/cache@v4
        with:
          path: cache
          key: nbe-cache-${{ github.run_id }}
          restore-keys: nbe-cache-

      - name: Run the analysis
        env:
          NBE_DATE: ${{ inputs.date }}
        run: |
          python -m nbe.run ${NBE_DATE:+--date "$NBE_DATE"} --cache cache --out output/nbe.json

      - name: Validate the output
        run: python tests/validate_nbe.py output/nbe.json

      - name: Commit the run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output state
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          day=$(python -c "import json; print(json.load(open('output/nbe.json'))['date'])")
          git commit -m "nightly run for $day"
          git push
